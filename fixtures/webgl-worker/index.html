<!doctype html><html><head><meta charset="utf-8"><title>WebGL in a worker</title>
<style>html,body{margin:0;background:#000}#c{position:fixed;left:0;top:0;width:600px;height:400px;z-index:2}</style></head>
<body><canvas id="c" width="600" height="400"></canvas>
<script>
// Synthetic: a canvas whose control goes to a worker; the worker draws a full-screen quad each frame with uTime (its clock) and
// uProgress (0 -> 1 over 60 frames from its 10th frame, linear), and a constant uColor.
const off = document.getElementById('c').transferControlToOffscreen();
const w = new Worker('worker.js');
w.postMessage({ canvas: off }, [off]);
w.onmessage = (e) => { if (e.data === 'drawn') window.CASE_DONE = true; };
</script></body></html>
