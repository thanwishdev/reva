<style>
/* The move card (DESIGN 5). A quiet gallery you read; the only colour on the page belongs to the sites recorded. Frames are tone and
   space, never a border. The accent is the playhead on a curve and the focus ring, nowhere else. Nothing here is under 14 px, and
   nothing moves on scroll: the motion on this page belongs to the site. */
html.mvc{--mve:cubic-bezier(.22,1,.36,1);--bar:68px;--mvw:min(calc(100vw - 80px),1320px)}
/* a jump inside the card stops under the sticky bar, not behind it */
html.mvc{scroll-padding-top:var(--barpx,var(--bar))}
.mvc body{background:var(--bg)}
.mvc .side{position:sticky;top:0;z-index:30;display:flex;flex-wrap:nowrap;align-items:center;gap:32px;height:var(--bar);padding:0 40px;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;transition:background-color .24s var(--mve)}
/* The bar's frosted glass sits on its own layer. A backdrop blur is drawn again on every frame the page moves under it (PF: about half
   the GPU time of a scroll), so while the page scrolls the glass steps aside for a near-solid fill and comes back softly once it rests. */
.mvc .side::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);transition:opacity .24s var(--mve)}
.mvc.mv-moving .side{background:var(--bg);transition:none}
.mvc.mv-moving .side::before{opacity:0;visibility:hidden;transition:none}
.mvc .side .brand{display:none}
.mvc .side .site{display:block;flex:none;margin:0;font-size:16px;font-weight:500;color:var(--ink)}
.mvc .side .site a{color:inherit;text-decoration:none}
.mv-built{min-width:0;flex:0 1 auto;font-size:15px;color:var(--ink2);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color var(--t1) var(--ease)}
.mv-built:hover{color:var(--ink)}
.mv-sp{flex:1 1 0;min-width:0}
.mv-vps{flex:none;display:flex;gap:18px;margin-left:16px}
.mv-vps button,.mvc .side nav a,.mv-findw{border:0;background:none;padding:0;font:inherit;font-size:15px;line-height:44px;color:var(--ink2);text-decoration:none;transition:color var(--t1) var(--ease)}
.mv-vps button:hover,.mvc .side nav a:hover,.mv-findw:hover{color:var(--ink)}
.mv-vps button[aria-pressed="true"],.mvc .side nav a[aria-current]{color:var(--ink);font-weight:600}
.mvc .side nav{flex:none;flex-direction:row;gap:24px;width:auto;margin:0;-webkit-mask-image:none;mask-image:none}
.mv-findw{flex:none;cursor:pointer}
.mv-q{flex:none;width:0;height:32px;padding:0;border:0;border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;font-size:15px;opacity:0;transition:width 220ms var(--mve),opacity 120ms linear,padding 220ms var(--mve)}
.mvc.mv-finding .mv-q{width:200px;padding:0 10px;opacity:1}
.mvc.mv-finding .mv-findw{display:none}
.mv-vps button:disabled{opacity:.45;cursor:default}
.mv-vps button:disabled:hover{color:var(--ink2)}
/* the page picker of Design and Study sits on the page it picks for, so the bar above stays the same on every tab */
.st-pagepick{display:flex;align-items:center;gap:10px;font-size:16px;line-height:24px;color:var(--ink2)}
.st-pagepick .st-pagesel{max-width:280px}
#design>.st-pagepick{margin-top:24px}
html.mvc:not(.mv-other) main,.mvc.on-stage main{max-width:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

#moves{display:block;padding:0}
#moves.enter{animation:mv-fade 160ms linear both}
@keyframes mv-fade{from{opacity:0}to{opacity:1}}
.mv-wrap{width:var(--mvw);margin:0 auto;padding:12px 0 120px}
.mv-page{position:relative;display:block;width:100%;height:min(68dvh,calc(var(--mvw) * .625));padding:0;border:0;border-radius:14px;overflow:hidden;background:var(--surface);cursor:pointer}
.mv-few .mv-page{height:calc(100dvh - var(--bar) - 96px)}
.mv-page video,.mv-page img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center}
/* a phone recording is tall: it sits whole in the wide frame (centred on the surface), never cropped */
.mv-page.ph video,.mv-page.ph img{object-fit:contain;object-position:center}
.mv-clear{margin-left:8px;border:0;background:none;padding:0;font:inherit;color:var(--ink);text-decoration:underline;text-underline-offset:4px;cursor:pointer;min-height:44px}
.mv-cap{display:flex;align-items:center;gap:20px;margin-top:14px;font-size:16px;line-height:24px;color:var(--ink2)}
.mv-cap button{border:0;background:none;padding:0;font:inherit;color:var(--ink);transition:color var(--t1) var(--ease)}
.mv-cap select{field-sizing:content;height:32px;max-width:280px;border:0;padding:0;background:none;color:var(--ink2);font:inherit;font-size:16px;cursor:pointer}

/* The site's motion system first: what a person came for, in sentences, the page beside it (6 Nov review: the answer sat at the
   bottom, under 180 moves). Text and space, no box; the tokens are a quiet row of words and one Copy. */
.mv-top{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:56px;align-items:start}
.mv-top.solo{display:block}
.mv-top.solo .mv-sys{display:none}
.mv-sys{min-width:0;padding-top:4px}
.mv-sys h1{font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.02em}
.mv-sys p{margin-top:14px;font-size:18px;line-height:28px;letter-spacing:-.005em;color:var(--ink)}
.mv-sys p:first-of-type{margin-top:20px}
.mv-tok{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;margin-top:28px}
.mv-tok .cp{height:44px;padding:0 16px;border:0;border-radius:10px;background:var(--surface);font:inherit;font-size:15px;color:var(--ink);transition:background var(--t1) var(--ease)}
.mv-tok .cp:hover{background:var(--surface2)}
.mv-tok [data-tok]{border:0;background:none;padding:0;font:inherit;font-size:15px;line-height:44px;color:var(--ink2);transition:color var(--t1) var(--ease)}
.mv-tok [data-tok]:hover,.mv-tok [data-tok][aria-pressed="true"]{color:var(--ink)}
.mv-tok [data-tok][aria-pressed="true"]{font-weight:600}
.mv-tokd{margin-top:10px}
.mv-tokd summary{cursor:pointer;font-size:15px;line-height:36px;color:var(--ink2)}
.mv-tokd pre{max-height:280px;overflow:auto;margin:6px 0 0;padding:16px;border-radius:10px;background:var(--surface);font-family:var(--mono);font-size:14px;line-height:21px;color:var(--ink);white-space:pre}
.mv-tokd pre.prose{max-height:420px;white-space:pre-wrap;overflow-wrap:anywhere}
.mv-top:not(.solo) .mv-page,.mv-top:not(.solo) .mv-few .mv-page,.mv-few .mv-top:not(.solo) .mv-page{height:auto;aspect-ratio:16/10}
.mv-u{display:block;margin-top:2px;font-size:15px;line-height:20px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv-recipe p+p{margin-top:8px}
.mv-recipe details{margin-top:8px}
.mv-recipe summary{cursor:pointer;color:var(--ink2)}
.mv-uses p+p{margin-top:2px}
.mv-code .mv-partsel{display:flex;align-items:center;gap:10px;margin-bottom:4px;font-size:15px;color:var(--ink2)}
.mv-code .mv-partsel select{max-width:100%;height:36px;border:0;padding:0;background:none;color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.mv-sec{margin-top:88px}
.mv-sec.first{margin-top:72px}
.mv-sec h1{font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.02em}
.mv-sec h2{font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.015em}
.mv-g{margin-top:28px}
.mv-r{display:flex;gap:28px;margin-top:40px}
.mv-r:first-child{margin-top:0}
.mv-sec.small .mv-r{gap:20px;margin-top:32px}
.mv-sec.small .mv-r:first-child{margin-top:0}
.mv-t{display:block;min-width:0;flex:none;color:inherit;text-decoration:none;border-radius:14px}
.mv-h{display:block;position:relative;border-radius:14px;background:var(--surface)}
.mv-f{position:absolute;inset:0;display:block;border-radius:14px;overflow:hidden;background:var(--surface);will-change:transform}
.mv-f img,.mv-v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.mv-v{opacity:0;transition:opacity 120ms linear;background:transparent}
.mv-miss img{visibility:hidden}
.mv-miss::after{content:"The picture did not load";position:absolute;inset:0;display:grid;place-items:center;padding:12px;font-size:15px;line-height:20px;color:var(--ink2);text-align:center}
.mv-v.on{opacity:1}
.mv-t[data-play="scrub"] .mv-f{cursor:ew-resize}
.mv-n{display:block;margin-top:12px;font-size:16px;line-height:22px;font-weight:500;color:var(--ink);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mv-sec.small .mv-n{margin-top:10px;font-size:15px;line-height:20px}
.mv-more{display:block;margin-top:28px;border:0;background:none;padding:0;font:inherit;font-size:16px;line-height:44px;color:var(--ink2);transition:color var(--t1) var(--ease)}
.mv-more:hover{color:var(--ink)}
.mv-none{margin-top:64px;font-size:20px;line-height:28px;color:var(--ink2)}
.mv-only{margin-top:48px;font-size:16px;line-height:24px;color:var(--ink2)}
.mv-only button{border:0;background:none;padding:0;font:inherit;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.mv-end{max-width:720px;margin-top:120px;font-size:20px;line-height:30px;letter-spacing:-.01em;color:var(--ink)}
.mv-end p{color:inherit}
.mv-end p+p{margin-top:12px}
.mv-end p.cov{margin-top:32px;color:var(--ink2)}
.mv-end a{color:inherit;text-underline-offset:3px}
.mvc.mv-searching .mv-top,.mvc.mv-searching .mv-end,.mvc.mv-searching .mv-sec[data-g="top"]{display:none}
.mvc.mv-searching .mv-sec{margin-top:48px}
.mv-fading{opacity:0}
#mv-lists{transition:opacity 120ms linear}

/* One motion: grows out of its frame, over the gallery, which stays where it was. */
.mv-one{position:fixed;inset:var(--bar) 0 0 0;z-index:20;overflow-y:auto;background:var(--bg);overscroll-behavior:contain}
.mv-one[hidden]{display:none}
/* the way out, in plain sight: a bare cross with a 44 px touch area (Esc, and a click outside, work as well) */
.mv-x{position:fixed;top:calc(var(--barpx,var(--bar)) + 8px);right:16px;z-index:6;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:none;color:var(--ink2);cursor:pointer;display:grid;place-items:center;transition:color var(--t1) var(--ease),background-color var(--t1) var(--ease)}
.mv-x:hover{color:var(--ink);background:var(--surface)}
.mv-x svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;fill:none}
.mvc.mv-lock{overflow:hidden}
.mvc.mv-solid .side{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}.mvc.mv-solid .side::before{display:none}
.mv-onew{display:grid;grid-template-columns:minmax(0,58fr) minmax(0,42fr);gap:64px;width:min(calc(100vw - 80px),1480px);min-height:100%;margin:0 auto;padding:12px 0 96px}
.mv-left{position:sticky;top:12px;align-self:start;min-width:0}
.mv-big{position:relative;width:100%;max-height:calc(100dvh - var(--bar) - 104px);margin:0 auto}
.mv-big .mv-f{position:absolute;inset:0;width:auto;height:auto}
.mv-big .mv-noclip{position:absolute;inset:0;display:grid;place-items:center;padding:32px;font-size:16px;line-height:24px;color:var(--ink2);text-align:center}
.mv-ctl{display:flex;align-items:center;gap:20px;height:56px;margin-top:8px;font-size:15px;color:var(--ink2)}
.mv-ctl button{flex:none;height:44px;border:0;background:none;padding:0;font:inherit;color:var(--ink2);transition:color var(--t1) var(--ease)}
.mv-ctl button:hover,.mv-ctl button[aria-pressed="true"]{color:var(--ink)}
.mv-ctl .pl{width:44px;margin-left:-14px;display:grid;place-items:center;color:var(--ink)}
.mv-ctl .pl svg{width:14px;height:14px;fill:currentColor}
.mv-track{position:relative;flex:1;min-width:48px;height:44px;cursor:pointer;touch-action:none}
.mv-track i{position:absolute;left:0;right:0;top:21px;height:2px;border-radius:2px;background:var(--surface2);transition:height 120ms linear,top 120ms linear}
.mv-track b{position:absolute;left:0;right:0;top:21px;height:2px;border-radius:2px;background:var(--ink);transform:scaleX(0);transform-origin:0 50%;transition:height 120ms linear,top 120ms linear}
.mv-track:hover i,.mv-track:hover b,.mv-track.drag i,.mv-track.drag b{top:20px;height:4px}
.mv-right{max-width:560px;min-width:0;padding-top:4px}
.mv-right.in{animation:mv-rise 240ms var(--mve) 120ms both}
@keyframes mv-rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mv-right h1{font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.02em;overflow-wrap:anywhere}
.mv-sent{margin-top:14px;font-size:20px;line-height:29px;letter-spacing:-.01em;color:var(--ink)}
.mv-facts{margin:40px 0 0}
.mv-facts>div{margin-top:22px}
.mv-facts dt{font-size:16px;line-height:24px;color:var(--ink2)}
.mv-facts dd{margin:0;font-size:16px;line-height:24px;color:var(--ink)}
.mv-curve{display:flex;align-items:center;gap:20px;margin-top:6px}
.mv-curve svg{flex:none;display:block;width:160px;height:104px;overflow:visible}
.mv-curve path,.mv-parts path{fill:none;stroke:var(--ink);stroke-width:1.5;vector-effect:non-scaling-stroke}
.mv-curve circle.d,.mv-parts circle.d{fill:var(--faint);opacity:.5}
.mv-curve line,.mv-parts line{stroke:var(--accent);stroke-width:1.5;vector-effect:non-scaling-stroke}
.mv-curve circle.h,.mv-parts circle.h{fill:var(--accent)}
/* Parts that move differently: their curves side by side, each with its name. */
.mv-parts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:10px}
.mv-parts figure{margin:0;min-width:0}
.mv-parts svg{display:block;width:100%;height:auto;aspect-ratio:160/104;overflow:visible}
.mv-parts figcaption{margin-top:10px;font-size:15px;line-height:21px;color:var(--ink);overflow-wrap:anywhere}
.mv-parts figcaption span{display:block;color:var(--ink2)}
.mv-parts figcaption .mv-pv{font-size:14px;line-height:20px}
.mv-why{max-width:440px}
.mv-status{margin-top:20px;font-size:16px;line-height:24px;color:var(--ink2)}
.mv-status b{font-weight:600;color:var(--ink)}
.mv-gap{margin-top:32px;font-size:16px;line-height:24px;color:var(--ink)}
/* Timing, Code and For my agent are tabs: each shows what it copies before the one Copy takes it (6 Nov review) */
.mv-use{margin-top:36px}
.mv-ttabs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 22px}
.mv-ttabs [role="tab"]{border:0;background:none;padding:0;font:inherit;font-size:16px;line-height:44px;color:var(--ink2);transition:color var(--t1) var(--ease)}
.mv-ttabs [role="tab"]:hover,.mv-ttabs [role="tab"][aria-selected="true"]{color:var(--ink)}
.mv-ttabs [role="tab"][aria-selected="true"]{font-weight:600}
.mv-ttabs .cp{margin-left:auto;height:44px;padding:0 16px;border:0;border-radius:10px;background:var(--surface);font:inherit;font-size:15px;color:var(--ink);transition:background var(--t1) var(--ease)}
.mv-ttabs .cp:hover{background:var(--surface2)}
.mv-usepanel pre{max-height:320px;overflow:auto;margin:8px 0 0;padding:16px;border-radius:10px;background:var(--surface);font-family:var(--mono);font-size:14px;line-height:21px;color:var(--ink);white-space:pre}
.mv-usepanel pre.prose{white-space:pre-wrap;overflow-wrap:anywhere}
.mv-claim{margin-top:14px;font-size:15px;line-height:22px;color:var(--ink2)}
.mv-claim+.mv-claim{margin-top:4px}
.mv-code{margin-top:8px}
.mv-tabs{display:flex;gap:18px;align-items:center}
.mv-tabs button{border:0;background:none;padding:0;font:inherit;font-size:15px;line-height:36px;color:var(--ink2)}
.mv-tabs button[aria-pressed="true"]{color:var(--ink);font-weight:600}
.mv-note{margin-top:10px;font-size:15px;line-height:22px;color:var(--ink2)}
.mv-rest{margin-top:48px}
.mv-rest>div,.mv-rest>details{margin-top:18px}
.mv-rest h3,.mv-rest summary{font-size:16px;line-height:24px;font-weight:400;color:var(--ink2)}
.mv-rest summary{cursor:pointer}
.mv-rest p{font-size:16px;line-height:24px}
.mv-rest a{color:inherit;text-underline-offset:3px}
.mv-pclip{position:relative;width:180px;margin-top:10px;border-radius:14px;overflow:hidden;background:var(--surface)}
.mv-pclip img,.mv-pclip video{display:block;width:100%;height:auto}
.mv-det{margin-top:14px;font-size:15px;line-height:23px}
.mv-det h4{margin-top:20px;font-size:15px;font-weight:600}
.mv-det code{font-family:var(--mono);font-size:14px;overflow-wrap:anywhere}

/* The page, full window: the wheel drives the recording here, and only here. */
.mv-full{position:fixed;inset:var(--bar) 0 0 0;z-index:20;display:grid;place-items:center;padding:0 40px 32px;background:var(--bg)}
.mv-full[hidden]{display:none}
.mv-full .box{position:relative;max-width:100%;max-height:100%;border-radius:14px;overflow:hidden;background:var(--surface)}
.mv-full video{display:block;width:100%;height:100%;object-fit:contain}
.mv-full p{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);font-size:15px;line-height:24px;color:var(--ink2);transition:opacity 320ms linear}

/* Site: a column to read. */
.mv-site{width:min(calc(100vw - 80px),720px);margin:0 auto;padding:48px 0 120px}
.mv-site h1{font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.02em}
.mv-site .feel{color:var(--ink);margin-top:20px;font-size:20px;line-height:30px;letter-spacing:-.01em}
.mv-site .feel+.feel{margin-top:10px}
.mv-site h2{margin-top:64px;font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.015em}
.mv-site ul{list-style:none;margin:16px 0 0;padding:0}
.mv-site li{padding:6px 0;font-size:16px;line-height:26px}
.mv-site li button{border:0;background:none;padding:0;font:inherit;color:var(--ink);text-align:left}
.mv-site li button:hover{text-decoration:underline;text-underline-offset:3px}
.mv-site li span{color:var(--ink2)}
.mv-site h3{margin-top:28px;font-size:16px;line-height:24px;font-weight:600}
.mv-site details{margin-top:12px}
.mv-site summary{cursor:pointer;font-size:16px;line-height:26px;color:var(--ink2)}
.mv-site p.q{margin-top:16px;font-size:16px;line-height:26px;color:var(--ink2)}
.mv-site p.gap{margin-top:12px;font-size:16px;line-height:26px;color:var(--ink)}
.mv-site .log{margin-top:20px}

@media (max-width:1180px){.mv-built{display:none}.mvc .side{gap:24px}}
@media (max-width:980px){
  .mv-top{display:block}
  .mv-top .mv-pagecol{margin-top:32px}
  .mv-onew{display:block;width:calc(100vw - 80px)}
  .mv-left{position:static}
  .mv-right{max-width:640px;margin-top:24px}
}
@media (max-width:760px){
  html.mvc{--bar:auto;--mvw:calc(100vw - 32px)}
  .mv-sys{padding-top:20px}
  .mv-sys p{font-size:17px;line-height:26px}
  /* two rows, the same on every tab: the site, Desktop / Phone and Find; then the tabs, the whole width (6 Nov review: Study cut off) */
  .mvc .side{position:sticky;height:auto;flex-wrap:wrap;gap:0 16px;padding:4px 16px}
  .mvc .side .site{order:1;flex:1 1 0;min-width:0;line-height:44px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mv-vps{order:2;gap:14px;margin-left:0}
  .mv-findw,.mv-q{order:3}
  .mvc.mv-finding .mv-q{width:150px}
  .mvc.mv-finding .mv-vps{display:none}
  .mvc .side nav{order:4;flex:1 0 100%;gap:20px;-webkit-mask-image:none;mask-image:none}
  .st-pagepick{min-width:0}
  .st-pagepick .st-pagesel{min-width:0;flex:1 1 auto}
  .st-top{flex-wrap:wrap}
  .mv-sp{display:none}
  .mv-wrap{padding-bottom:72px}
  .mv-page{height:calc(var(--mvw) * .625)}
  .mv-onew{padding-top:52px}
  .mv-x{right:8px}
  .mv-few .mv-page{height:calc(var(--mvw) * .625)}
  .mv-r,.mv-sec.small .mv-r{display:block;margin-top:0}
  .mv-t{width:100%!important;margin-top:28px}
  .mv-r:first-child .mv-t:first-child{margin-top:0}
  .mv-sec{margin-top:64px}
  .mv-one,.mv-full{top:var(--barpx,104px)}
  .mv-onew{width:calc(100vw - 32px);padding-bottom:64px}
  .mv-full{padding:0 16px 32px}
  .mv-site{width:calc(100vw - 32px)}
  .mv-ctl button,.mv-copy button{min-height:44px}
}
@media (prefers-reduced-motion:reduce){
  .mv-v,.mv-right.in,#moves.enter,#mv-lists{transition:none;animation:none}
}

/* The finale (owner 11 Nov): plays once as it comes into view. The real move pictures of the card above leave their own places,
   shrink and travel into one box at the centre of the screen, where they fold into a pile and the box closes: the whole card as one
   object, on the scanned site's own ease. The box says only what matters and hands over the one file. */

    const local = location.protocol === 'file:', dir = decodeURIComponent(location.pathname.replace(/[^/]*$/, ''));
    const where = (f) => (local ? `${dir}${f}` : `${f} (in the scan folder ${SC.dirName || 'this card sits in'})`);
    return String(p || '').replace(/^(\s*)(Reference frames|Spec and code|Shader sources \(not in this text\)|WebGL tables \(not in this text\)): (\S+)/gm, (a, sp, k, f) => (f === 'the' ? a : `${sp}${k}: ${where(f)}`));
  }
  async function copy(text, btn) {
    const word = btn.dataset.word || btn.textContent; btn.dataset.word = word;
    try { await navigator.clipboard.writeText(text); }
    catch (e) { const t = document.createElement('textarea'); t.value = text; document.body.append(t); t.select(); try { document.execCommand('copy'); } catch (x) { /* the text stays on screen in its tab */ } t.remove(); }
    btn.textContent = 'Copied'; clearTimeout(btn.copied); btn.copied = setTimeout(() => { btn.textContent = btn.dataset.word; delete btn.dataset.word; }, 1200);
  }
  function onOneWheel(e) {
    const m = O.m; if (!m || !m.frame || m.frame.play !== 'scrub' || !e.target.closest('#mv-big')) return;
    e.preventDefault(); halt(HAND); setPlayIcon(false);
    HAND.seek(Math.min(base() + dur() - 1 / 60, Math.max(base(), HAND.currentTime + e.deltaY / 1400)));
    wake();
  }

  /* ---------- The page ---------- */
  const F = { t: 0, a: 0, b: 0, ready: false };
  async function pageOn() {
    const full = $('#mv-full'), h = heroOf(); full.hidden = false; root.classList.add('mv-solid');
    if (!h) { full.innerHTML = `${CLOSEB}<div class="box"><p>No recording of this page.</p></div>`; return; }
    const segs = heroSegs(h), r = S.vp === 'phone' ? 390 / 844 : 1.6, room = Math.min(innerWidth - 80, (innerHeight - $('.side').offsetHeight - 32) * r);
    full.innerHTML = `${CLOSEB}<div class="box" id="mv-fbox" style="width:${Math.round(room)}px;height:${Math.round(room / r)}px"></div><p id="mv-fhint">Scroll to drive the recording.</p>`;
    PAGE.loop = false; PAGE.classList.add('on'); PAGE.style.position = 'static'; $('#mv-fbox').append(PAGE);
    document.title = `The page, REVA card: ${MV.site.host}`;
    const go = (s) => setSrc(PAGE, s.src).then(() => { F.a = s.a; F.b = s.b; F.t = s.a; F.ready = true; });
    if (!REDUCED && segs[0]) { await setSrc(PAGE, segs[0].src); if (S.screen !== 'page') return; range(PAGE, segs[0].a, segs[0].b, () => { const s = segs[1]; if (s && S.screen === 'page') go(s).then(() => { PAGE.currentTime = s.a; }); }); }
    else if (segs[1]) go(segs[1]);
    F.wheel = (e) => {
      if (!F.ready && segs[1]) { halt(PAGE); go(segs[1]); }
      e.preventDefault();
      if (!F.ready) return;
      F.t = Math.min(F.b - 1 / 60, Math.max(F.a, F.t + e.deltaY / 900)); PAGE.seek(F.t);
      const hint = $('#mv-fhint'); if (hint) hint.style.opacity = 0;
    };
    full.addEventListener('wheel', F.wheel, { passive: false });
  }
  function pageOff() {
    const full = $('#mv-full'); if (!S.oneId) root.classList.remove('mv-solid'); if (F.wheel) { full.removeEventListener('wheel', F.wheel); F.wheel = null; }
    F.ready = false; PAGE.style.position = ''; if (PAGE.parentNode && PAGE.parentNode.id === 'mv-fbox') { PAGE.remove(); full.innerHTML = ''; }
  }

  /* ---------- Site ---------- */
  const CLASSES = { rule: "REVA's own rules", limit: 'Limits of this scan', notBuilt: 'Not built yet', broke: 'What broke', impossible: 'What no tool can read' };
  function renderSite() {
    const feel = (SYS && SYS.sentences) || (MV.site.feel && MV.site.feel.sentences) || [], cov = MV.coverage || {}, sc = MV.scan || {};
    // a tile once, both screens: a pattern counts on every page one of its moves ran on
    const onPage = (m, i) => m.pg.includes(i) || (m.uses && m.uses.moves.some((id) => byId.has(id) && byId.get(id).pg.includes(i)));
    const counts = MV.site.pages.map((_, i) => MV.moves.filter((m) => shownOnce(m) && onPage(m, i)).length);
    const rc = MV.records, rec = rc && Number.isFinite(rc.all) ? `${rc.all.toLocaleString('en-US')} records: ${rc.onCard.toLocaleString('en-US')} shown on the card, ${rc.folded.toLocaleString('en-US')} folded into a pattern${rc.offCard ? `, ${rc.offCard.toLocaleString('en-US')} kept off (not a move, or a consent banner)` : ''}` : null;
    const reasons = (cov.reasons || []).filter((r) => (r.words || []).length), summary = (cov.summary || []).slice(0, 4);
    // what the gaps mean, in a few lines; the ledger's own lines fold under them (6 Nov review: an internal log on the Site page)
    const flat = reasons.length || !(MV.missing || []).length ? '' : `<ul>${MV.missing.map((p) => `<li>${esc(p)}</li>`).join('')}</ul>`;
    const made = [sc.date && `Recorded on ${sc.date}`, sc.engine && `With ${sc.engine === 'cft' ? 'Chrome for Testing' : sc.engine}`, sc.wallMs && `In ${Math.round(sc.wallMs / 60000)} minutes`, MV.tally && `${MV.tally.frames.toLocaleString('en-US')} frames recorded`, rec].filter(Boolean);
    const notOpened = cov.notOpened || [], notN = Number.isFinite(cov.notOpenedN) ? Math.max(cov.notOpenedN, notOpened.length) : notOpened.length;
    const lead = coverageLine();
    $('#mv-sitescreen').innerHTML = `<div class="mv-site">
      <h1 tabindex="-1">How this site moves</h1>${feel.map((s) => `<p class="feel">${esc(s)}</p>`).join('')}
      <h2>Pages</h2><p class="q">A move on several pages counts on each of them.</p><ul>${MV.site.pages.map((p, i) => `<li><button type="button" data-fp="${i}">${esc(p.label)}</button> <span>${counts[i] === 1 ? 'one move' : `${counts[i]} moves`}</span></li>`).join('')}</ul>
      ${notOpened.length ? `<details><summary>${notN === 1 ? 'One page' : `${notN.toLocaleString('en-US')} pages`} not opened${notN > notOpened.length ? `, the first ${notOpened.length} listed` : ''}</summary><ul>${notOpened.map((p) => `<li>${esc(p)}</li>`).join('')}</ul></details>` : ''}
      <h2>What could not be read</h2>${lead ? `<p class="q">${esc(lead)}</p>` : ''}
      ${cov.consent ? `<p class="gap" id="mv-consent">${esc(cov.consent)}</p>` : ''}
      ${summary.map((w) => `<p class="gap">${esc(w)}</p>`).join('')}
      ${reasons.length || flat ? `<details class="log"><summary>Technical log</summary>${reasons.map((r) => `<h3>${esc(CLASSES[r.class] || r.class)}</h3><ul>${r.words.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>`).join('')}${flat}</details>` : ''}
      <p class="q">Some things no recording can tell: what only a server knows, the original source and tokens, DRM video, how the site feels on your own machine, and pages nobody links to.</p>
      ${made.length ? `<h2>How this was made</h2><details><summary>Show</summary><ul>${made.map((w) => `<li>${esc(w)}</li>`).join('')}</ul></details>` : ''}
    </div>`;
    $$('[data-fp]', $('#mv-sitescreen')).forEach((b) => b.addEventListener('click', () => { S.page = +b.dataset.fp; S.shown = {}; location.hash = 'moves'; }));
  }

  /* ---------- Find, keys ---------- */
  function findOpen() { root.classList.add('mv-finding'); const q = $('#mv-q'); q.focus(); }
  function findClose() { const q = $('#mv-q'); q.value = ''; S.q = ''; root.classList.remove('mv-finding'); q.blur(); draw(); heroStart(); }
  {
    const q = $('#mv-q'); let last = 0;
    $('#mv-findw').addEventListener('click', findOpen);
    q.addEventListener('input', () => {
      if (S.screen !== 'home') location.hash = 'moves';
      const was = !!S.q; S.q = q.value.trim().toLowerCase(); clearTimeout(last);
      if (S.q) heroStop();
      const lists = $('#mv-lists'); lists.classList.add('mv-fading');
      last = setTimeout(() => { draw(); lists.classList.remove('mv-fading'); if (!S.q && was) heroStart(); }, REDUCED ? 0 : 120);
    });
    q.addEventListener('keydown', (e) => { if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); findClose(); } });
    q.addEventListener('blur', () => { if (!q.value) root.classList.remove('mv-finding'); });
  }
  addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const t = e.target, typing = t && /^(input|textarea|select)$/i.test(t.tagName);
    if (e.key === '/' && !typing) { e.preventDefault(); e.stopImmediatePropagation(); if (S.screen !== 'home') location.hash = 'moves'; findOpen(); return; }
    if (typing || root.classList.contains('mv-other')) return;
    // the arrows belong to the control that has focus: the tabs, the clip's time
    if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && t && t.closest && t.closest('[role="tablist"],[role="slider"]')) return;
    if (e.key === 'Escape' && (S.screen === 'one' || S.screen === 'page')) { e.preventDefault(); location.hash = 'moves'; return; }
    if (S.screen === 'one') {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); step(e.key === 'ArrowLeft' ? -1 : 1); }
      else if (e.key === ' ' && !(t && t.closest && t.closest('button,a,summary'))) { e.preventDefault(); $('#mv-pl')?.click(); }
    }
  }, true);

  /* ---------- a light smooth wheel (owner 11 Nov) ----------
     A mouse wheel's notches carry the window toward a target, 0.11 of the gap per 60 Hz frame (the feel of Lenis lerp 0.1), and
     only the wheel: a trackpad, touch, the keys and the scrollbar stay native, and so does any wheel whose kind is unclear. It moves
     the window itself (scrollTo each frame), so the sticky bar, the observers and the finale see a plain scroll. No frame loop while
     still. Native inside anything that scrolls on its own, over a panel fixed above the page, with ctrl / meta (zoom) or a sideways
     wheel. Off with reduced motion and in print. A jump inside the card (a Design part) glides the same way and stops under the bar. */
  {
    const mq = (q) => (typeof matchMedia === 'function' ? matchMedia(q) : { matches: false });
    const RM = mq('(prefers-reduced-motion: reduce)'), PR = mq('print'), LERP = 0.11;
    const W = { on: false, cur: 0, to: 0, t: 0, raf: 0, last: -1e9, kind: null, frames: 0 };
    const off = () => RM.matches || PR.matches;
    const max = () => Math.max(0, document.documentElement.scrollHeight - innerHeight);
    const stop = () => { if (W.raf) cancelAnimationFrame(W.raf); W.raf = 0; W.on = false; };
    const frame = (now) => {
      W.raf = 0;
      // something else moved the window meanwhile (a tab's jump to the top, the keys, the scrollbar): it wins, no jump back
      if (Math.abs(scrollY - W.cur) > 2) { W.on = false; return; }
      const dt = W.t ? Math.min(64, now - W.t) : 16.667; W.t = now;
      W.to = Math.min(W.to, max());
      W.cur += (W.to - W.cur) * (1 - Math.pow(1 - LERP, dt / 16.667));
      if (Math.abs(W.to - W.cur) < 0.5) W.cur = W.to;
      scrollTo(0, W.cur); W.frames++;
      if (W.cur !== W.to) W.raf = requestAnimationFrame(frame); else W.on = false;
    };
    const go = (y) => {
      y = Math.max(0, Math.min(max(), y));
      if (!W.on) { W.cur = scrollY; W.t = 0; W.on = true; }
      W.to = y; if (!W.raf) W.raf = requestAnimationFrame(frame);
    };
    // a wheel's notches: lines or pages (Firefox), or the legacy delta in whole 120s that is not three times the pixels (Chrome and
    // Safari give a trackpad exactly -3 x); with no legacy delta, whole steps of 50 px or more; anything else counts as a trackpad
    const kind = (e) => {
      if (e.deltaMode === 1 || e.deltaMode === 2) return 'wheel';
      const w = e.wheelDeltaY;
      if (w) return w !== -3 * e.deltaY && Math.abs(w) % 120 === 0 ? 'wheel' : 'pad';
      return Number.isInteger(e.deltaY) && Math.abs(e.deltaY) >= 50 ? 'wheel' : 'pad';
    };
    // something under the pointer scrolls on its own this way (a list, a code block, a dialog), or keeps its scroll to itself, or
    // sits fixed above the page
    const inner = (el, dy) => {
      for (; el && el.nodeType === 1 && el !== document.body && el !== document.documentElement; el = el.parentElement) {
        if (el.hasAttribute('data-native-scroll')) return true;
        const cs = getComputedStyle(el);
        if (cs.position === 'fixed') return true;
        if (/auto|scroll|overlay/.test(cs.overflowY) && el.scrollHeight > el.clientHeight + 1) {
          if (dy > 0 ? el.scrollTop + el.clientHeight < el.scrollHeight - 1 : el.scrollTop > 0) return true;
          if (cs.overscrollBehaviorY !== 'auto') return true;
        }
      }
      return false;
    };
    addEventListener('wheel', (e) => {
      if (!e.isTrusted || e.defaultPrevented || e.ctrlKey || e.metaKey || off()) return;
      // one gesture is one kind: a trackpad's stream stays native until it rests a quarter second
      const k = kind(e), fresh = e.timeStamp - W.last > 250; W.last = e.timeStamp;
      W.kind = !fresh && W.kind === 'pad' ? 'pad' : k;
      const dy = e.deltaY;
      if (W.kind !== 'wheel' || e.shiftKey || !dy || Math.abs(e.deltaX) > Math.abs(dy)) { if (W.on) stop(); return; }
      if (inner(e.target, dy)) return;
      if (max() < 1 || getComputedStyle(document.documentElement).overflowY === 'hidden' || getComputedStyle(document.body).overflowY === 'hidden') return;
      e.preventDefault();
      const px = e.deltaMode === 1 ? dy * 40 : e.deltaMode === 2 ? dy * innerHeight : dy;
      go((W.on ? W.to : scrollY) + Math.max(-innerHeight, Math.min(innerHeight, px)));
    }, { passive: false });
    // the keys, the scrollbar, a touch, a print: native at once, from wherever the glide had got to
    addEventListener('keydown', (e) => { if (W.on && /^( |Spacebar|PageUp|PageDown|ArrowUp|ArrowDown|Home|End)$/.test(e.key)) stop(); }, true);
    addEventListener('pointerdown', () => { if (W.on) stop(); }, true);
    addEventListener('touchstart', () => { if (W.on) stop(); }, { capture: true, passive: true });
    addEventListener('beforeprint', stop);
    if (RM.addEventListener) RM.addEventListener('change', stop);
    /** A jump inside the card: the element's top under the bar (the page's scroll padding and its own scroll margin), gliding. */
    const into = (el) => {
      const y = scrollY + el.getBoundingClientRect().top - (parseFloat(getComputedStyle(document.documentElement).scrollPaddingTop) || 0) - (parseFloat(getComputedStyle(el).scrollMarginTop) || 0);
      if (off()) { stop(); scrollTo(0, y); } else go(y);
    };
    window.__smoothInto = into;
    window.__smooth = { state: () => ({ on: W.on, to: W.to, frames: W.frames, kind: W.kind }), kind, into };
  }

  /* ---------- start ---------- */
  shell();
  // the bar's glass rests while the page moves (see .side::before): one passive listener, one class on the way in, one timer out
  { let mt = 0; const rest = () => { mt = 0; root.classList.remove('mv-moving'); };
    addEventListener('scroll', () => { if (!mt) root.classList.add('mv-moving'); else clearTimeout(mt); mt = setTimeout(rest, 160); }, { passive: true }); }
  let lastW = 0, wt = 0;
  addEventListener('resize', () => {
    clearTimeout(wt);
    wt = setTimeout(() => { if (innerWidth !== lastW && S.screen === 'home') { lastW = innerWidth; draw(); } if (O.m && O.m.frame) fitBig(O.inPage ? 1.6 : O.m.frame.w / O.m.frame.h); }, 120);
  });
  document.addEventListener('visibilitychange', () => { if (S.screen !== 'home') return; if (document.hidden) heroStop(); else if (PG.visible && !REDUCED) heroStart(); });
  addEventListener('hashchange', routeMoves);
  lastW = innerWidth;
  S.screen = null;
  draw();
  routeMoves();
  window.MOVES = { S, O, H, R, PG, marksOf, justify, videos: { PAGE, RELAY, HAND } };
})();
</script>
