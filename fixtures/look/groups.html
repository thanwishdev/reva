<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>look fixture: two staggered groups</title>
<!-- Own fixture for look's per-group stagger (no site content). Two folded groups move at the same time with the same
  shape (rAF tween easeOutCubic 400 ms, translateY 30 -> 0 px), interleaved:
  .dot x3  starts 200, 300, 400 ms (every 100 ms)
  .bar x4  starts 230, 300, 370, 440 ms (every 70 ms)
  Each group's stagger must count its own members only ("3 of 3", "4 of 4").
-->
<style>
  html, body { margin: 0; }
  .dot { position: absolute; top: 80px; width: 160px; height: 160px; background: #436; transform: translateY(30px); }
  .bar { position: absolute; top: 320px; width: 180px; height: 100px; background: #634; transform: translateY(30px); }
</style>
</head>
<body>
<div class="dot" style="left:40px"></div><div class="dot" style="left:240px"></div><div class="dot" style="left:440px"></div>
<div class="bar" style="left:40px"></div><div class="bar" style="left:240px"></div><div class="bar" style="left:440px"></div><div class="bar" style="left:640px"></div>
<script>
  const ease = (p) => 1 - Math.pow(1 - p, 3);
  const items = [...[...document.querySelectorAll('.dot')].map((e, i) => [e, 200 + 100 * i]), ...[...document.querySelectorAll('.bar')].map((e, i) => [e, 230 + 70 * i])];
  const t0 = performance.now();
  const tick = (now) => {
    let busy = false;
    for (const [e, start] of items) { const p = Math.min(1, Math.max(0, (now - t0 - start) / 400)); if (p < 1) busy = true; if (now - t0 >= start) e.style.transform = `translateY(${30 * (1 - ease(p))}px)`; }
    if (busy) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
</script>
</body>
</html>
