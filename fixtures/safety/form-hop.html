<!doctype html>
<!-- A page that posts a form to an allowed URL that answers 302 to a robots-disallowed URL (test/safety/nav-guard.test.js). -->
<html><head><meta charset="utf-8"><title>form-hop</title></head>
<body style="margin:0;font:16px/1.5 system-ui">
<div style="width:200px;height:200px;background:#09f;animation:a 600ms ease-out both">box</div>
<style>@keyframes a{from{transform:translateY(40px)}to{transform:none}}</style>
<script>setTimeout(function () { var f = document.createElement('form'); f.action = '/hop'; f.method = 'post'; document.body.appendChild(f); f.submit(); }, 300);</script>
</body></html>
