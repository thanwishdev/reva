<!doctype html>
<!-- A page that sends the browser on to a URL its robots.txt disallows, after it has loaded (test/safety/nav-guard.test.js).
     The gate's preflight sees only this page; the navigation guard must stop the browser at /private/. -->
<html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=/private/target.html"><title>refresh</title></head>
<body style="margin:0;font:16px/1.5 system-ui">
<div style="width:200px;height:200px;background:#09f;animation:a 600ms ease-out both">box</div>
<style>@keyframes a{from{transform:translateY(40px)}to{transform:none}}</style>
</body></html>
