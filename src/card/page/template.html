<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REVA card</title>
<style>
/* REVA card, v4 (WORKING page: people read and use it).
   Structure: six pages in one file, one page on screen at a time (hash routes: #overview, #motion/<n>, #timeline,
   #design[/type|colour|spacing|shapes|layout|states], #libraries, #recording). Each page has its own layout.
   Reading order on every page: what a person understands first (the replay, one plain sentence, one or two big
   numbers); everything technical (intervals, models, selectors, provenance) sits behind "Details" on that page.
   Type: one system sans; mono only inside code blocks. Ground: pure white / near black. Grouping by soft tinted
   panels (tone, space), never by borders or boxes. One accent (blue): moving elements, the playhead, the current item,
   and a faint tint on the motion stage. Motion: short and functional. Page change: fade + 8 px rise, 220 ms on the
   house curve cubic-bezier(.4,0,.2,1) (corpus: top-tier working pages, a docs site's curve; hover p50 180 ms); reduced
   motion makes it instant. Buttons 40 px, radius 10 (working-page buttons p50 36-40 px). Body 16 px. */
:root{
  --bg:#ffffff; --surface:#f4f4f6; --surface2:#e9e9ed; --ink:#111113; --ink2:#4a4d54; --faint:#6a6d74;
  --line:#e2e2e7; --line2:#ededf1; --ring:transparent;
  --accent:#2a5bff; --fit:#2b59ff; --accent-soft:rgba(42,91,255,.12); --good:#16794a; --bad:#c0362c; --warn:#7a4800;
  --panel:#f6f6f8; --stage:color-mix(in srgb,var(--accent) 6%,#f7f8fb); --code:var(--surface);
  --sans:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease:cubic-bezier(.4,0,.2,1); --t1:160ms; --t2:220ms;
  --gut:40px; --max:1120px; --pad:32px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c0c0e; --surface:#17171a; --surface2:#222227; --ink:#f2f2f4; --ink2:#b2b4bb; --faint:#8e9198;
    --line:#2b2b31; --line2:#1f1f24; --ring:rgba(255,255,255,.09); --accent:#7f9bff; --fit:#6d8bff; --accent-soft:rgba(127,155,255,.18);
    --good:#5cc98f; --bad:#ff8a7d; --warn:#e0b252; --panel:#141417; --stage:color-mix(in srgb,var(--accent) 9%,#111114);
  }
}
:root[data-theme="dark"]{
  --bg:#0c0c0e; --surface:#17171a; --surface2:#222227; --ink:#f2f2f4; --ink2:#b2b4bb; --faint:#8e9198;
  --line:#2b2b31; --line2:#1f1f24; --ring:rgba(255,255,255,.09); --accent:#7f9bff; --fit:#6d8bff; --accent-soft:rgba(127,155,255,.18);
  --good:#5cc98f; --bad:#ff8a7d; --warn:#e0b252; --panel:#141417; --stage:color-mix(in srgb,var(--accent) 9%,#111114);
}
*{box-sizing:border-box}
html{scroll-padding-top:24px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:inherit;text-underline-offset:3px}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.15;letter-spacing:-.015em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}
code,pre{font-family:var(--mono);font-size:13.5px}
.mono,.v,.hx{font-family:var(--sans);font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)} .faint{color:var(--faint)}
.small{font-size:15px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.warn{color:var(--warn)}
.pass{color:var(--good)} .fail{color:var(--bad);font-weight:600}

/* shell: a quiet page list on the left (desktop), a frosted top bar on narrower screens. The current page is the
   darker, heavier word: no pill, no bar (owner taste). */
.shell{display:grid;grid-template-columns:184px minmax(0,1fr);gap:72px;max-width:1440px;margin:0 auto;padding:0 var(--gut)}
.side{position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;padding:40px 0 32px;scrollbar-width:none;display:flex;flex-direction:column}
.side .brand{display:block;font-weight:650;letter-spacing:-.01em;text-decoration:none}
.side .site{display:block;color:var(--ink2);font-size:15px;line-height:1.4;margin-top:4px;overflow-wrap:break-word}
.side nav{display:flex;flex-direction:column;margin-top:40px}
.side nav a{display:block;padding:7px 0;color:var(--ink2);text-decoration:none;font-size:16px;transition:color var(--t1) var(--ease)}
.side nav a:hover{color:var(--ink)}
.side nav a[aria-current="page"],.side nav a[aria-current="true"]{color:var(--ink);font-weight:600}
.side nav a.sub{padding:4px 0 4px 14px;font-size:15px;display:none}
.side nav.in-design a.sub:not(.msub),.side nav.in-motion a.msub{display:block}
.side nav a.msub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.findbtn{margin-top:28px;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:0;border-radius:10px;background:var(--surface);color:var(--ink2);font-size:15px;width:100%;text-align:left;transition:background var(--t1) var(--ease),color var(--t1) var(--ease)}
.findbtn:hover{color:var(--ink);background:var(--surface2)}
.findbtn svg{width:16px;height:16px;flex:none}
.findbtn kbd{margin-left:auto;font:inherit;font-size:14px;color:var(--faint)}
main{min-width:0;max-width:1120px;padding-bottom:96px}

/* pages: one on screen; the others stay findable (hidden="until-found") and print in order */
.view{min-width:0}
.view>.vin{padding-top:48px}
.view.enter>.vin{animation:vin var(--t2) var(--ease) both}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ptitle{font-size:40px;letter-spacing:-.03em;line-height:1.1;overflow-wrap:anywhere}
.lead{color:var(--ink2);max-width:62ch;font-size:18px;line-height:1.5;margin-top:12px}
.sub2{font-size:22px;letter-spacing:-.015em;margin:0 0 6px}
/* a group on a page: a soft tinted panel, no border */
.panel{margin-top:72px;min-width:0}
.lead+.panel,.tl-ctl+.panel,.ptitle+.panel{margin-top:40px}
.panel>.sub2:first-child{margin-top:0}
.panel .plead{color:var(--ink2);max-width:64ch;margin:2px 0 18px}
.foot{padding:64px 0 0;color:var(--ink2);font-size:15px;max-width:64ch}

/* ---------- overview ---------- */
.ov-head .sum{font-size:20px;line-height:1.45;color:var(--ink2);max-width:58ch;margin-top:14px}
.mini-wrap{position:relative;margin:36px auto 0;width:min(100%,calc((100vh - 140px) * 1.6))}
.mini{position:relative;width:100%;aspect-ratio:1440/900;overflow:hidden;border-radius:18px;background:#fff;box-shadow:0 0 0 1px var(--ring),0 1px 2px rgba(0,0,0,.06),0 16px 48px rgba(0,0,0,.10)}
.mini .mb{position:absolute;padding:0;border:0;border-radius:4px;background:transparent no-repeat;background-size:100% 100%;cursor:pointer;
  outline:1.5px solid transparent;outline-offset:2px;transition:outline-color var(--t1) var(--ease)}
.mini .bd{position:absolute;background:no-repeat;background-size:100% 100%;pointer-events:none;opacity:0}
.mini .mb.nocrop{outline-style:dashed}
.mini .mb.nocrop.live{background-color:var(--accent-soft)}
.mini .mb.sel:hover{outline:1.5px solid var(--accent)}
.mini .mb:hover{outline-color:var(--accent)}
.mini .mb.gl,.mini .mb.gl.live{background-color:transparent}
.mini .pt{position:absolute;pointer-events:none}
/* a replayed element: the outline stays where it is in the crop, its own pixels (.px, or one .gm per group member) move */
.mini .mb.ov{overflow:visible}
.mini .mb .px,.mini .mb .gm{position:absolute;background-repeat:no-repeat;transform-origin:50% 50%;pointer-events:none;border-radius:inherit}
.mini .mb .px{inset:0;background-size:100% 100%}
.ctl[hidden]{display:none}
.ctl{display:flex;align-items:center;gap:14px;margin-top:14px}
.off{margin-top:16px;color:var(--ink2);font-size:15px;text-align:center}
.pv-wrap{margin-top:36px}
.pageview{max-height:min(78vh,880px);overflow-y:auto;border-radius:18px;background:var(--surface);box-shadow:0 0 0 1px var(--ring),0 1px 2px rgba(0,0,0,.06),0 16px 48px rgba(0,0,0,.10);overscroll-behavior:contain}
.pvin{position:relative;width:100%}
.pvin .mb{position:absolute;padding:0;border:0;border-radius:4px;background:transparent;cursor:pointer;outline:1.5px dashed color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:2px;transition:outline-color var(--t1) var(--ease)}
.pvin .mb:hover,.pvin .mb.sel{outline:2.5px solid var(--accent)}
.pvframe{position:absolute;left:0;width:100%;background-size:100% 100%;background-repeat:no-repeat;pointer-events:none}
.pvframe[hidden]{display:none}
.pvwin{position:absolute;left:0;right:0;pointer-events:none;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 30%,transparent)}
.pvin .mb{background-size:100% 100%}
.pvin .mb.live{outline-style:solid;outline-color:var(--accent)}
/* what moves: one plain line per motion, a picture of it, a click opens its page */
.wm-h{margin-top:64px}
.wmlist{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 24px}
.wm{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:16px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:12px;margin:0;border-radius:16px;color:var(--ink);text-decoration:none;transition:background var(--t1) var(--ease)}
.wm:hover{background:var(--panel)}
.wm .thumb{width:72px;height:52px;border-radius:10px;background:var(--surface)}
.wm .wn{display:block;font-weight:600;overflow-wrap:anywhere;line-height:1.35}
.wm .wf{display:block;color:var(--ink2);line-height:1.4;margin-top:2px}
.wm .go{color:var(--faint);transition:transform var(--t1) var(--ease),color var(--t1) var(--ease)}
.wm:hover .go{color:var(--accent);transform:translateX(3px)}
.ct{color:var(--ink2);font-weight:400}
.mi .thumb,.thumb{display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb .tc{display:block;background-repeat:no-repeat;border-radius:3px}

/* ---------- buttons, toggles, ranges ---------- */
.btn{height:40px;padding:0 16px;border:0;border-radius:10px;background:var(--surface);color:var(--ink);font-size:15px;font-weight:500;white-space:nowrap;transition:background var(--t1) var(--ease),opacity var(--t1) var(--ease)}
.btn:hover{background:var(--surface2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--ink);color:var(--bg);min-width:84px}
.btn.pri:hover{opacity:.86;background:var(--ink)}
.btn.icon{width:40px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.btn.icon svg{width:18px;height:18px}
input[type=range]{flex:1;accent-color:var(--accent);min-width:0;height:24px}
.ms{font-size:15px;color:var(--ink2);min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:12px;background:var(--surface)}
.seg button{height:32px;min-width:44px;border:0;background:none;padding:0 12px;border-radius:8px;color:var(--ink2);font-size:15px;font-weight:500;transition:background var(--t1) var(--ease),color var(--t1) var(--ease)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg button[disabled]{opacity:.45;cursor:not-allowed}
.tabs{display:inline-flex;gap:2px;padding:4px;border-radius:12px;background:var(--surface)}
.tabs button{height:32px;border:0;background:none;padding:0 14px;border-radius:8px;color:var(--ink2);font-size:15px;font-weight:500;transition:background var(--t1) var(--ease),color var(--t1) var(--ease)}
.tabs button[aria-selected="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* ---------- motion: one per page ---------- */
.mtop{display:flex;align-items:center;gap:16px;justify-content:space-between}
.mtop .of{color:var(--ink2);font-size:16px}
.mtop .pn{display:flex;gap:8px}
.mlist{display:flex;gap:4px;overflow-x:auto;margin:20px calc(var(--gut) * -1) 0;padding:0 var(--gut) 6px;scrollbar-width:none}
.mlist::-webkit-scrollbar{display:none}
.mi{flex:none;display:flex;align-items:center;gap:10px;max-width:240px;border:0;background:none;padding:6px 14px 6px 6px;border-radius:14px;text-align:left;color:var(--ink2);transition:background var(--t1) var(--ease),color var(--t1) var(--ease)}
.mi:hover{background:var(--surface);color:var(--ink)}
.mi[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.mi .thumb{flex:none;width:44px;height:32px;border-radius:8px;background:var(--surface2)}
.mi .thumb.none{background:var(--surface2)}
.mi .nm{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi[aria-selected="true"] .nm{font-weight:600}
.mpanel{min-width:0;overflow-wrap:anywhere}
.mpanel[hidden]{margin:0}
.mpanel.enter{animation:vin var(--t2) var(--ease) both}
/* the sentence is the heading: what a person came to read */
.mpanel .sentence{font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.022em;max-width:48em}
.feel{font-size:18px;line-height:28px;color:var(--ink2);margin-top:6px}
.tag{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-size:15px;line-height:24px;color:var(--ink2)}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.tag.t-exact{color:var(--good)}
.tag.t-exact::before{background:var(--good)}
.tag.t-fitted{color:color-mix(in srgb,var(--fit) 80%,var(--ink))}
.tag.t-fitted::before{background:var(--fit)}
.tag.varies{color:var(--warn)}
.tag.varies::before{background:var(--warn)}
/* the bench: replay beside the curve on one clock */
.bench{--sh:clamp(280px,44vh,400px);display:grid;grid-template-columns:minmax(0,16fr) minmax(0,11fr);grid-template-areas:"stage curve" "ctl ctl";gap:0 24px;margin-top:20px}
.bench.solo{grid-template-columns:minmax(0,1fr);grid-template-areas:"curve" "ctl"}
.bench.solo .stage{grid-area:curve}
/* the replay: a camera on the real page. .cam is the same first screen the Overview plays, at real px */
.stage[hidden]{display:none}
.stage{grid-area:stage;position:relative;height:var(--sh);border-radius:16px;overflow:hidden;background:var(--surface);box-shadow:0 0 0 1px var(--line);isolation:isolate}
.cam{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;will-change:transform}
.gd[hidden]{display:none}
.gd{position:absolute;left:0;top:0;width:100%;height:100%;background-repeat:no-repeat;background-size:100% 100%;will-change:transform}
.cam .pt{position:absolute;pointer-events:none}
.cam .mb{position:absolute;padding:0;border:0;background:transparent no-repeat;background-size:100% 100%;pointer-events:none;overflow:visible}
.cam .mb .px,.cam .mb .gm{position:absolute;background-repeat:no-repeat;transform-origin:50% 50%}
.cam .mb .px{inset:0;background-size:100% 100%}
.cam .px.block,.cam .mb.block{background:color-mix(in srgb,var(--bp,var(--fit)) 12%,transparent);box-shadow:inset 0 0 0 1.5px var(--bp,var(--fit));display:flex;align-items:center;justify-content:center;color:var(--bp,var(--fit));font-size:18px;font-weight:500}
.bp{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.bp rect,.bp path,.bp line{fill:none;stroke:var(--bp,var(--fit));stroke-width:1;shape-rendering:crispEdges}
.bp .st{stroke-dasharray:4 4}
.bp path{shape-rendering:auto}
.bp text{font:600 15px var(--sans);fill:var(--bp,var(--fit));paint-order:stroke;stroke:var(--bpg,#fff);stroke-width:4px;stroke-linejoin:round}
.stage .still{position:absolute;left:12px;bottom:12px;right:12px;width:fit-content;font-size:15px;line-height:1.35;color:var(--ink);background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:6px 12px;border-radius:10px}
.curvebox{grid-area:curve;height:var(--sh);min-width:0;position:relative;display:flex;flex-direction:column}
.plot{flex:1;min-height:0;width:100%;display:block;overflow:visible;touch-action:none;cursor:ew-resize}
.plot text{font:15px var(--sans);fill:var(--faint)}
.plot .lbl{fill:var(--ink2)}
.plot .rule{stroke:var(--line2);stroke-width:1;shape-rendering:crispEdges}
.plot .curve-line{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.plot .fr{fill:var(--fit)}
.plot .ref{fill:none;stroke:var(--faint);stroke-width:1;stroke-dasharray:1 5;stroke-linecap:round}
.plot .axis{stroke:var(--line);stroke-width:1;shape-rendering:crispEdges}
.plot .head{stroke:var(--fit);stroke-width:1}
.plot .dotp{fill:var(--fit);stroke:var(--bg);stroke-width:2}
.plot .band{fill:var(--accent-soft)}
.plot .phase{stroke:var(--faint);stroke-width:1;stroke-dasharray:1 4}
.plot text.enm{font-size:17px;font-weight:600;letter-spacing:-.01em;fill:var(--ink)}
.plot a:hover text.enm{fill:var(--fit)}
.trust{font-size:15px;line-height:22px;color:var(--ink2);margin-top:2px}
.pctl[hidden]{display:none}
.pctl{grid-area:ctl;display:flex;align-items:center;gap:12px;margin-top:14px}
.pctl .ms{min-width:72px}
/* four numbers on one line; each one copies */
.nums{display:grid;grid-template-columns:auto auto auto minmax(0,1fr);gap:16px 56px;margin-top:24px}
.num{display:flex;flex-direction:column;align-items:flex-start;gap:0;min-width:0;border:0;background:none;padding:0;text-align:left;color:var(--ink);font:inherit;border-radius:8px}
button.num:hover .lab{color:var(--ink)}
.num .lab{order:0;font-size:15px;line-height:22px;color:var(--ink2);transition:color var(--t1) var(--ease)}
.num .big{order:1;font-size:32px;line-height:40px;letter-spacing:-.025em;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.num .big.long{font-size:22px;letter-spacing:-.01em;white-space:normal;overflow-wrap:anywhere}
.num .big .u{font-size:18px;font-weight:500;color:var(--ink2);margin-left:4px;letter-spacing:0}
.num .why{order:2;margin-top:2px;font-size:15px;color:var(--warn);line-height:1.4;max-width:30ch}
.codebox{margin-top:28px}
.codebar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.codebar .acts{display:flex;gap:8px}
.codebox[hidden]{display:none}
.fit{cursor:help;position:relative;display:inline-block;line-height:1.1;border-bottom:1.5px dotted var(--ink2)}
.fit[data-ci]:hover::after,.fit[data-ci]:focus-visible::after{content:attr(data-ci);position:absolute;right:0;top:calc(100% + 8px);z-index:30;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font:500 14px/1.3 var(--sans);white-space:nowrap;letter-spacing:0}

/* folds: no rules, a chevron, content fades in */
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.mpanel .folds{margin-top:40px}
.mpanel details>summary,.fold>summary{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:500;color:var(--ink);border-radius:10px}
.mpanel details>summary::after,.fold>summary::after{content:"";width:8px;height:8px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform var(--t2) var(--ease);opacity:.6;flex:none}
details[open]>summary::after{transform:translateY(2px) rotate(-135deg)}
details[open]>:not(summary){animation:fin var(--t2) var(--ease) both}
@keyframes fin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.mpanel details>summary:hover,.fold>summary:hover{color:var(--accent)}
.mpanel details[open]{padding-bottom:24px}
.dgrp{margin-top:20px}
.dgrp h3{font-size:17px;margin-bottom:6px}
.facts-p p{margin:6px 0;max-width:80ch;color:var(--ink)}
.mean{margin:6px 0 0;padding:0;list-style:none}
.mean li{margin:8px 0;max-width:80ch}
.vals{width:100%;border-collapse:collapse;margin:12px 0 20px;font-size:15px}
.vals caption{text-align:left;font-weight:600;padding:8px 0 6px}
.vals td,.vals th{padding:7px 0;border-top:1px solid var(--line2);vertical-align:top;font-weight:400;text-align:left}
.vals td.n{text-align:right;padding-left:16px;overflow-wrap:anywhere}
.vals td.c{text-align:right;color:var(--ink2);width:80px;padding-left:12px;font-size:14px}
.vals td.u{color:var(--ink2);width:64px;padding-left:6px;font-size:14px}
pre{margin:0;background:var(--code);border-radius:12px;padding:16px 18px;overflow:auto;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.codeblk+.codeblk{margin-top:12px}
.codemeta{font-size:15px;color:var(--ink2);margin:4px 0 8px}
.selrow{font-size:15px;color:var(--ink2);margin:4px 0 14px}
.nocode{font-size:15px;color:var(--ink2);margin-top:12px}
.know{margin-top:24px}
.know h4{margin:0 0 10px;font-size:17px}
.know dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:8px 18px}
.know dt{color:var(--ink2)}
.know dd{margin:0}
.know ul{margin:0;padding-left:18px}

/* ---------- timeline ---------- */
.tl-ctl{display:flex;align-items:center;gap:12px;margin-top:28px}
.legend{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:center;color:var(--ink2);font-size:15px;margin-top:24px}
.legend .li{display:inline-flex;gap:10px;align-items:center}
.legend .sw{display:inline-block;width:28px;height:10px;border-radius:5px;background:var(--accent)}
.legend .sw.f{background:color-mix(in srgb,var(--accent) 50%,transparent)}
.legend .sw.u{background:none;box-shadow:inset 0 0 0 1.5px var(--faint)}
.choreo .sentence{color:var(--ink2);margin-bottom:12px}
.crow{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:center;padding:9px 12px;margin:0 -12px;border:0;background:none;width:calc(100% + 24px);text-align:left;border-radius:12px;transition:background var(--t1) var(--ease)}
.crow:hover{background:var(--surface)}
.crow:hover .cname{color:var(--accent)}
.cname{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cchip{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--ink2);white-space:nowrap}
.ctrack{position:relative;height:22px;background:linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat}
.cbar{position:absolute;top:4px;height:14px;border-radius:7px;background:var(--accent)}
.cbar.k-fitted{background:color-mix(in srgb,var(--accent) 50%,transparent)}
.cbar.k-unknown{background:none;box-shadow:inset 0 0 0 1.5px var(--faint)}
.clead{position:absolute;top:4px;height:14px;border-radius:7px 0 0 7px;background:var(--surface2)}
.csettle{position:absolute;top:0;height:22px;border-left:1.5px dotted var(--ink)}
.cnote{margin-left:252px;font-size:15px;color:var(--ink2);margin-top:10px}
.caxis{position:relative;height:24px;margin-left:252px;margin-right:12px;font-size:14px;color:var(--ink2)}
.caxis span{position:absolute;transform:translateX(-50%)}
.caxis span:last-child{transform:translateX(-100%)}
.caxis span.tclash{visibility:hidden}
.cwrap{position:relative}
.cwrap .playhost{position:absolute;left:240px;right:0;top:0;bottom:0;pointer-events:none}
.playline{position:absolute;top:-2px;bottom:-2px;width:0;border-left:1.5px solid var(--accent);pointer-events:none;z-index:3}
.curves{display:flex;flex-wrap:wrap;gap:20px}
.curve{display:flex;flex-direction:column;gap:10px;font-size:15px;color:var(--ink2);line-height:1.45;max-width:180px}
.curves+.fold{margin-top:20px}
.curve svg{width:112px;height:66px;background:var(--surface);border-radius:12px;color:var(--ink)}
.dots{position:relative;height:56px;margin:36px 0 24px}
.dots .bz em{position:absolute;top:26px;left:0;font-style:normal;font-size:14px;color:var(--ink2);white-space:nowrap}
.dots .bands{position:absolute;left:0;right:0;top:26px;height:20px}
.dots .bz{position:absolute;top:0;height:20px;background:var(--surface);border-radius:6px}
.dots .d{position:absolute;top:30px;width:12px;height:12px;border-radius:50%;background:var(--accent);transform:translateX(-50%)}
.dots .d.f{background:var(--surface);box-shadow:inset 0 0 0 2px var(--accent)}
.dots .t{position:absolute;transform:translateX(-50%);font-size:14px;color:var(--ink2);white-space:nowrap}

/* ---------- libraries, recording ---------- */
.libs{list-style:none;margin:0;padding:0}
.lib{padding:14px 0}
.lib+.lib{border-top:1px solid color-mix(in srgb,var(--ink) 6%,transparent)}
.lib .ln{font-size:20px;font-weight:600;letter-spacing:-.01em}
.lib .ls{color:var(--ink2);margin-top:2px}
.fold{margin-top:6px;color:var(--ink)}
.fold[open]>summary{margin-bottom:8px}
.ev{margin:0;padding:0;list-style:none;font-size:15px}
.ev li{padding:8px 0;border-top:1px solid var(--line2);overflow-wrap:anywhere}
.snip{font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
.folded ul,.mv{margin:8px 0 0;padding:0;list-style:none}
.mv li{padding:6px 0;overflow-wrap:anywhere}
.glsrc{white-space:pre;overflow:auto;max-height:420px}
.rl{margin:8px 0 0;padding:0;list-style:none}
.rl li{padding:5px 0;overflow-wrap:anywhere}
.rd p{max-width:72ch}
.rd+.rd{margin-top:28px}
.rd .gname{margin-top:20px}
.declist{list-style:none;margin:10px 0 0;padding:0}.dec{padding:16px 0}
.decbody{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-top:6px}
.dplot{width:120px;height:56px;flex:none;background:var(--surface);border-radius:10px}.dplot .ref{stroke:var(--faint);stroke-dasharray:3 4;fill:none}.dplot .curve-line{fill:none;stroke:var(--ink);stroke-width:2}
.dprops{list-style:none;margin:6px 0 0;padding:0}.dprops li{margin:4px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.swc{display:inline-block;width:14px;height:14px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--line)}
.cert.k-exact{font-size:14px;color:var(--ink2)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px 32px}
.fact .fv{font-size:21px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
.fact .fl{color:var(--ink2);margin-top:4px}
.nm ul{margin:0;padding-left:20px}
.nm li{margin:8px 0;max-width:80ch}

/* ---------- design: a design-system page, each group a tinted panel ---------- */
.dnav{display:none;flex-wrap:wrap;gap:4px 18px;margin:20px 0 0;font-size:16px}
.dnav a{padding:6px 0;text-decoration:none;color:var(--ink2)}
.dnav a:hover{color:var(--ink)}
.dsec{scroll-margin-top:24px}
.dsec h2{font-size:24px;letter-spacing:-.02em;margin-bottom:6px}
.dsec>.lead,.dsec .plead{font-size:16px;margin:4px 0 20px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:stretch}
.two>.panel{margin-top:72px}
.tgroup{padding:12px 0 0}
.gname{font-size:15px;font-weight:600;color:var(--ink);margin:10px 0 4px}
.tyrow{display:grid;grid-template-columns:minmax(0,1fr) 72px 64px 56px 72px 56px;gap:14px;padding:6px 0;align-items:baseline}
.tyhead{color:var(--ink2);font-size:15px;padding:0}
.tyhead span{text-align:right}
/* a sample wraps between words, never inside one; a single word wider than its column fades out at the edge */
.tyrow .smp{line-height:1.1;white-space:normal;overflow-wrap:normal;overflow:hidden;min-width:0;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
.tyrow .tm{font-size:15px;text-align:right;white-space:nowrap;color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{font-weight:600;text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 10px 6px 0;border-top:1px solid var(--line2);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.scroll{overflow-x:auto}
.crole{margin:22px 0 10px;font-weight:600}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px}
.cch{display:flex;flex-direction:column;gap:10px;font-size:15px;min-width:0}
.cch .sq{display:block;width:100%;height:88px;border-radius:16px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 8%,transparent)}
.cch .hx{font-weight:600;color:var(--ink)}
.cgrid.sm{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px}
.cgrid.sm .cch .sq{height:48px;border-radius:12px}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px 24px;margin-top:8px}
.pair{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;font-size:15px}
.pair .chip{height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 8%,transparent)}
.spbar{height:16px;border-radius:5px;background:var(--accent);min-width:1px;max-width:100%}
.steps{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px}
.stp{display:grid;grid-template-columns:62px 130px minmax(0,1fr);align-items:center;gap:12px;font-size:15px;padding:3px 0}
.stp .uses{display:flex;align-items:center;gap:8px;color:var(--ink2)}
.ubar{display:inline-block;height:6px;border-radius:3px;background:var(--faint)}
.shapes{display:grid;grid-template-columns:1fr;gap:16px}
.rad{display:flex;flex-wrap:wrap;gap:20px}
.rad .r{display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--ink2)}
.rad .tile{width:64px;height:64px;border:2px solid var(--ink);background:none}
.shd{display:flex;flex-wrap:wrap;gap:20px;padding:20px;border-radius:16px}
.shd .s{display:flex;flex-direction:column;gap:12px;font-size:15px}
.shd .tile{width:96px;height:60px;border-radius:12px}
.pat{margin:6px 0 0;padding:0;list-style:none}
.pat li{padding:6px 0;max-width:80ch}
.rulerbox{margin:8px 0 0}
.ruler{width:100%;height:auto;display:block}
.ruler text{font:14px var(--sans);fill:var(--ink2)}
.strip{display:flex;flex-direction:column;width:130px}
.strip div{background:var(--surface);margin-top:2px;font-size:12px;color:var(--ink2);overflow:hidden;padding-left:4px}
.sw-mini{display:inline-block;width:12px;height:12px;border-radius:3px;box-shadow:inset 0 0 0 1px var(--line);vertical-align:-1px;margin-right:4px}

/* ---------- search (the fallback for find in hidden pages) ---------- */
.find{position:fixed;inset:0;z-index:60;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px;background:color-mix(in srgb,var(--bg) 40%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.find[hidden]{display:none}
.find .box{width:min(560px,100%);max-height:70vh;display:flex;flex-direction:column;background:var(--bg);border-radius:20px;box-shadow:0 0 0 1px var(--ring),0 24px 64px rgba(0,0,0,.18);overflow:hidden}
.find input{border:0;background:none;font:inherit;font-size:18px;color:var(--ink);padding:20px 22px;outline:none;width:100%}
.find ul{list-style:none;margin:0;padding:0 8px 8px;overflow-y:auto}
.find li button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 14px;border-radius:12px;color:var(--ink)}
.find li button:hover,.find li button.on{background:var(--surface)}
.find .fp{font-size:14px;color:var(--ink2)}
.find .fs{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.find mark{background:var(--accent-soft);color:inherit;border-radius:3px}
.find .none{padding:6px 22px 18px;color:var(--ink2)}
.hit{animation:hit 1.6s var(--ease)}
@keyframes hit{0%,40%{background:var(--accent-soft)}100%{background:transparent}}

@media (min-width:1080px){
  .mlist{display:none}
  .mtop{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  #motion>.vin{padding-top:40px}
}
@media (max-width:1079px){
  /* the page list becomes a frosted top bar that scrolls sideways */
  .mpanel{margin-top:20px}
  .bench,.bench.solo{grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "ctl" "curve";--sh:clamp(240px,40vh,400px)}
  .bench.solo .stage{grid-area:stage}
  .bench.solo:not(.nocurve) .curvebox{margin-top:0}
  .stage{height:auto;aspect-ratio:1440/900}
  .curvebox{height:auto;margin-top:20px;max-width:560px}
  .plot{flex:none;height:auto;aspect-ratio:440/372}
  html{scroll-padding-top:72px}
  .shell{display:block;padding:0}
  main{padding:0 var(--gut) 72px;margin:0 auto}
  .side{position:sticky;top:0;z-index:20;height:56px;flex-direction:row;align-items:center;gap:20px;padding:0 var(--gut);overflow:hidden;
    background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4)}
  .side .site{display:none}
  .side nav{flex-direction:row;margin:0;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1;mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent)}
  .side nav::-webkit-scrollbar{display:none}
  .side nav a{padding:8px 10px;white-space:nowrap;font-size:15px}
  /* the parts of Design and the motions stay out of the top bar (Design has its own list of parts): :not(.msub) matches
     the desktop rule's weight, without it Type, Colour, ... pushed Libraries and Recording out of a narrow frame */
  .side nav a.sub,.side nav.in-design a.sub:not(.msub),.side nav.in-motion a.msub{display:none}
  .findbtn{margin:0;width:40px;padding:0;justify-content:center;flex:none}
  .findbtn span,.findbtn kbd{display:none}
  .dnav{display:flex}
  /* type samples: below 1080 px the sample takes its own row and wraps between words, so a narrow frame never cuts
     one mid-word ("Mot|ion"); the numbers sit under it with their labels */
  .tyhead{display:none}
  .tyrow{grid-template-columns:repeat(5,auto);gap:0 12px;justify-content:start;padding:10px 0}
  .tyrow .smp{grid-column:1/-1;margin-bottom:6px}
  .tyrow .tm{text-align:left;display:flex;flex-direction:column;line-height:1.3}
  .tyrow .tm::before{content:attr(data-l);color:var(--ink2);font-size:14px}
  .view>.vin{padding-top:32px}
}
@media (max-width:980px){
  .two{grid-template-columns:1fr;gap:0}
  .wmlist{grid-template-columns:1fr}
}
@media (max-width:640px){
  :root{--gut:16px;--pad:20px}
  .side{gap:8px}
  .side nav a{padding:8px 8px}
  .ptitle{font-size:30px}
  .mpanel .sentence{font-size:22px;line-height:28px}
  .feel{font-size:16px;line-height:24px}
  .lead{font-size:17px}
  .ov-head .sum{font-size:18px}
  .mini-wrap{margin-top:24px}
  .mini{border-radius:12px}
  .nums{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 24px}
  .num:has(.big.long){grid-column:1/-1}
  .num .big{font-size:28px;line-height:36px}
  .num .big.long{font-size:20px;line-height:26px}
  .pctl{flex-wrap:wrap}
  .pctl input[type=range]{flex-basis:100%;order:5}
  .plot text{font-size:18px}
  .plot text.enm{font-size:19px}
  .crow{grid-template-columns:1fr;gap:4px}
  .wm{grid-template-columns:56px minmax(0,1fr) auto;gap:12px;padding:10px 8px}
  .wm .thumb{width:56px;height:42px}
  .caxis,.cnote{margin-left:0}
  .cwrap .playhost{left:12px}
  .caxis .tminor{display:none}
  .stp{grid-template-columns:58px 100px minmax(0,1fr)}
  .ruler text{font-size:22px}
  .cgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .cch .sq{height:64px}
  .know dl{grid-template-columns:1fr;gap:2px}
  .know dd{margin-bottom:10px}
}
@media (max-width:820px),(pointer:coarse){.mpanel details>summary{min-height:44px}}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none!important;animation:none!important}
}
@media print{
  /* every page, in order, each from a new sheet */
  .side,.ctl,.pctl,.dnav,.acts,.mlist,.mtop .pn,.tl-ctl,.find,.findbtn{display:none!important}
  .shell{display:block;padding:0}
  .view[hidden],.mpanel[hidden]{display:block!important;content-visibility:visible!important}
  .view+.view{break-before:page}
  .mpanel+.mpanel{break-before:page;margin-top:0}
  .pageview{max-height:none!important;overflow:visible!important}
  .mini{box-shadow:none}
  pre{white-space:pre-wrap}
  .panel,.curvebox,.stage,.bench{break-inside:avoid}
}

<script>
const DATA = /*__DATA__*/null;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function nf(n, d) {
  if (n == null || typeof n !== 'number' || isNaN(n)) return '—';
  if (d == null) d = Math.abs(n) >= 100 ? 0 : Math.abs(n) >= 10 ? 1 : 2;
  let s = n.toFixed(d);

}
const ms = n => nf(n) + ' ms';
const pct = (x, d = 1) => nf(x * 100, d) + ' %';
const unit = v => v && v.unit ? (v.unit === 'px' || v.unit === '%' ? v.unit : ' ' + v.unit) : '';
const px = v => v == null ? '—' : (typeof v === 'object' ? nf(v.value) + ' ' + (v.unit || 'px') : nf(v) + ' px');
function anchorHead(tag, id, text, cls) {
  return `<${tag} class="${cls || ''}" id="${id}">${esc(text)}</${tag}>`;
}
function hd(tag, id, text, cls) {
  return `<${tag} id="${id}" class="${cls || ''}" tabindex="-1">${esc(text)}</${tag}>`;
}
/* durations in plain words, one unit on a screen: ms below a second ("320 ms"), seconds above ("1 s", "4.05 s") */
const secs = n => (n == null || !Number.isFinite(n) ? '?' : n < 1000 ? nf(n, 0) + ' ms' : nf(n / 1000, 2) + ' s');
function fitSpan(text, ci, label) {
  return `<span class="fit" tabindex="0" data-ci="${esc(ci || 'fitted from the recorded frames; no interval recorded')}">${text}</span>`;

  return `95 % interval ${nf(p.ci95[0], 2)} to ${nf(p.ci95[1], 2)}${u ? ' ' + u : ''}`;

/* ---------- easing ---------- */
const KEYWORDS = { linear:[0,0,1,1], ease:[.25,.1,.25,1], 'ease-in':[.42,0,1,1], 'ease-out':[0,0,.58,1], 'ease-in-out':[.42,0,.58,1] };
function bezierFn(x1, y1, x2, y2) {
  // missing or non-numeric control points (a ramp piece has none): a straight line, never NaN. Callers that must not
  // draw a straight line for an unknown curve check the points themselves (isBz) before asking for the function.
  if (![x1, y1, x2, y2].every(Number.isFinite)) return t => (t <= 0 ? 0 : t >= 1 ? 1 : t);

/* ---------- timeline, libraries, recording: their own sections ---------- */
function timelineHTML() {
  if (!M.length) return '';
  const tickStep = [250, 500, 1000, 2000, 2500, 5000, 10000].find(st => AX / st <= 8) || 20000;
  const ticks = []; for (let t = 0; t <= AX; t += tickStep) ticks.push(t);
  const noClock = M.every(m => m.drive);
  const order = [...M].sort((a, b) => (a.rowT == null) - (b.rowT == null) || (a.rowT || 0) - (b.rowT || 0) || a.i - b.i);
  const rows = order.map(m => {
    let bar = '';
    if (m.drive) {
      const via = { scroll: 'the scroll', wheel: 'the wheel', pointer: 'the pointer' }[m.drive];
      bar = `<span class="cchip">${m.kind === 'smooth' ? `smooths ${via}` : m.know ? `follows ${via}` : m.s0Unk || m.s1Unk ? `follows ${via}, range not fully identified` : `follows ${via}, ${nf(m.s0, 0)} to ${nf(m.s1, 0)} px`}</span>`;
    } else if (m.t0 != null) {
      const own = m.stag ? (m.stag.n - 1) * m.stag.step : 0;
      const cl = v => Math.max(0, Math.min(100, v));
      const x0 = cl(m.startAbs / AX * 100), xs = cl(m.t0 / AX * 100), xe = cl((m.endAbs - own) / AX * 100), xz = cl(m.endAbs / AX * 100);
      if (m.lead) bar += `<span class="clead" style="left:${x0}%;width:${xs - x0}%" title="declared delay ${ms(m.lead)}"></span>`;
      bar += `<span class="cbar k-${m.cert}" style="left:${xs}%;width:${Math.max(Math.min(xe, 100) - xs, .6)}%"></span>`;
      if (m.stag) bar += `<span class="cbar k-${m.cert}" style="left:${xe}%;width:${Math.max(xz - xe, .6)}%;opacity:.35" title="${plu(m.stag.n, 'member starts', 'members start')} ${nf(m.stag.step)} ms apart"></span>`;
      if (m.kind === 'spring') bar += `<span class="csettle" style="left:${xz}%" title="settles at ${ms(m.endAbs)}"></span>`;
    } else if (m.winS != null) {
      bar = `<span class="cbar k-unknown" style="left:${Math.min(m.winS / AX * 100, 99)}%;width:${Math.max(Math.min((m.winE - m.winS) / AX * 100, 100 - m.winS / AX * 100), .6)}%" title="changed between ${ms(m.winS)} and ${ms(m.winE)}; no curve fits it"></span>`;
    } else {
      bar = `<span class="cbar k-unknown" style="left:0;width:100%" title="moved, start and curve unknown"></span>`;
    }
    return `<button class="crow" type="button" data-i="${m.i}"><span class="cname">${esc(m.name)}</span><span class="ctrack">${bar}</span></button>`;
  }).join('');
  return `<div class="choreo">
      <p class="sentence">${esc(choreoSentence())}</p>
      <div class="cwrap">${rows}${noClock ? '' : '<div class="playhost"><span class="playline" id="pline" style="left:0"></span></div>'}</div>
      ${noClock ? '' : `<div class="caxis">${ticks.map((t, k) => `<span${ticks.length > 4 && k % 2 ? ' class="tminor"' : ''} style="left:${t / AX * 100}%">${t}</span>`).join('')}</div>`}
      <p class="cnote">${noClock ? 'Every motion here follows the scroll or the pointer, so there is no clock to read. The bars show the input range.' : `Milliseconds since the ${L.action.do === 'load' ? 'page started loading' : 'recording started'}; the blue line is the replay.`}${M.some(m => m.lead) ? ' The grey lead-in is a wait before it starts.' : ''}</p>
    </div>`;
}
function systemHTML() {
  const known = M.filter(isCurve);
  if (!known.length) return '<p class="muted">No motion in this look runs on a measured curve over time, so there is no curve set to compare.</p>';
  const curves = new Map();
  for (const m of known) { const c = curves.get(m.curveKey) || { m, n: 0, durs: [] }; c.n++; c.durs.push(m.len); curves.set(m.curveKey, c); }
  // each curve with the durations it runs at: the shape and the time, which is what a person copies
  const curveHTML = [...curves.values()].map(c => `<div class="curve" title="${esc(c.m.curveLabel)}">${thumb(c.m)}<span><b style="color:var(--ink);font-weight:500">${esc(c.m.curveLabel.length > 22 ? 'Custom curve' : /^ease[A-Z]/.test(c.m.curveLabel) ? c.m.curveLabel : cap1(c.m.curveLabel))}</b><br>${esc([...new Set(c.durs.map(d => secs(d)))].join(', '))}${c.n > 1 ? ` <span class="faint">(${c.n} motions)</span>` : ''}</span></div>`).join('');
  const durs = new Map();
  for (const m of known) { const k = Math.round(m.len); const e = durs.get(k) || { n: 0, cert: m.cert }; e.n++; durs.set(k, e); }
  const bandOf = k => { const b = MATERIAL.find(x => k >= x[1] - 25 && k <= x[2] + 25); return b ? b[0] : (k > 1000 ? 'beyond the longest' : 'between bands'); };
  const bandTxt = [...durs.keys()].sort((a, b) => a - b).map(k => `${k} ms is ${bandOf(k)}`).join(', ');
  const dmax = Math.max(1000, ...[...durs.keys()]) * 1.06;
  // a band too narrow for its name keeps the name in its tooltip only
  const zones = MATERIAL.map(b => `<span class="bz" style="left:${b[1] / dmax * 100}%;width:${(b[2] - b[1]) / dmax * 100}%" title="${b[0]}: ${b[1]} to ${b[2]} ms">${(b[2] - b[1]) / dmax >= .09 ? `<em>${b[0]}</em>` : ''}</span>`).join('');
  const durDots = [...durs.entries()].sort((x, y) => x[0] - y[0]).map(([k, e], j) => `<span class="d ${e.cert === 'fitted' ? 'f' : ''}" style="left:${k / dmax * 100}%" title="${k} ms"></span><span class="t" style="left:${k / dmax * 100}%;top:${(j % 2) ? -22 : 0}px">${k}${e.n > 1 ? ' ×' + e.n : ''}</span>`).join('');
  return `<p class="plead">${known.length} timed ${known.length === 1 ? 'motion uses' : 'motions use'} ${curves.size} ${curves.size === 1 ? 'curve' : 'curves'}.</p>
    <div class="curves">${curveHTML}</div>
    ${fold('Durations against Material 3’s duration bands', `<p>${esc(bandTxt)}.</p><div class="dots"><div class="bands">${zones}</div>${durDots}</div>`)}`;
}
/* what the look was recorded from: a saved copy, the live site, REVA's demo page or a page on this computer */
function playedFrom() {

  if (src.demo) return 'REVA’s own demo page';
  let local = src.live === false;
  if (src.live == null) { try { local = /^(localhost|127(\.\d{1,3}){3}|\[::1\]|0\.0\.0\.0)$|\.localhost$/i.test(new URL(src.startUrl || '').hostname); } catch (e) { local = false; } }
  return local ? 'A page on this computer' : 'The live site';
}
function aboutHTML() {
  const vp = viewportOf();

  return `<div class="facts">${fact(whenOf(L) || 'Unknown', 'Recorded')}${fact(what, 'What was recorded')}${fact(`${vp.width} × ${vp.height}`, 'Screen size, px')}${fact(`${L.take.frames} at ${L.take.rate} fps`, 'Frames')}${fact(rep, 'Played from')}</div>
    <p class="plead" style="margin:24px 0 0">${esc(summaryOf(L))}</p>
    ${fold('How the replay on Overview is drawn', `<p class="muted" style="max-width:72ch">${L.screens && (L.screens.before || L.screens.viewport) ? `The replay is the first screen, drawn on ${L.screens.before ? 'a picture of the page at rest before the ' + recWord() : 'a picture of the page at the end of the recording'}.` : 'The replay is the first screen on the page’s background colour.'} Each outline is a moving element where it is at the end of the recording. Its own pixels from that moment move inside and around it by the measured values on the measured curves: every timed line plays in turn (a press, then its release), each relative to what the picture shows, so a button that sinks and springs back shrinks and returns although its picture is the button at rest. A group of alike elements is cut into its members, each starting at its own measured offset (an older recording without member boxes moves the group as one piece). Where the element sits on the background picture, a patch in the colour around it keeps it from showing twice. An element with no picture or no measured values is a plain outline moved between its start and end boxes. Anything outside the first screen is cut off. A scroll recording plays on the whole page instead: the frame is the screen, and each outline moves with the scroll as it was recorded.</p>`)}`;
}

/* the time axis keeps only labels that do not touch: in a narrow frame 1000 and 1250 would overlap. The first and the
   last label stay; a label closer than 8 px to the one kept before it goes */
function thinAxis(ax) {
  const sp = [...ax.children];
  for (const s of sp) s.classList.remove('tclash');
  const shown = sp.filter(s => getComputedStyle(s).display !== 'none');
  if (shown.length < 3 || !ax.clientWidth) return;
  const box = s => s.getBoundingClientRect();
  let prev = box(shown[0]);
  const last = shown[shown.length - 1], lastBox = box(last);
  for (const s of shown.slice(1, -1)) {
    const b = box(s);
    if (b.left < prev.right + 8 || b.right > lastBox.left - 8) s.classList.add('tclash'); else prev = b;
  }
}

/* what the page runs: read from the page itself where possible (GSAP, Lenis, Swiper / Lottie / Locomotive / anime.js),

const tagless = t => String(t || '').replace(/ \[(exact|fitted|measured|derived|unknown)\]/g, '');

    const all = `<div class="scroll"><table class="tbl"><thead><tr><th>Element</th><th>Property</th><th>Declared</th><th>Against the fit</th></tr></thead><tbody>${E.map(e => `<tr><td>${esc(e.desc)}</td><td class="v">${esc(e.prop || '')}</td><td>${esc(tagless(e.text).replace(/^GSAP declared( \([^)]*\))?: /, '').split(': disagrees')[0])}</td><td>${e.status === 'disagrees' ? `<span class="warn">disagrees</span>${e.fitted ? `, fit ${esc(e.fitted.durationMs != null ? nf(e.fitted.durationMs, 0) + ' ms' : '')}${e.fitted.ease ? ', ' + esc(e.fitted.ease) : ''}` : ''}` : esc(e.status === 'noFit' || e.status === 'no-fit' ? 'nothing recorded to compare' : e.status || '')}</td></tr>`).join('')}</tbody></table></div>`;
    out.push(`<div class="rd"><h3 class="gname" style="font-size:20px" id="lib-gsap">GSAP${g.version ? ' ' + esc(g.version) : ''}</h3>
      <p>Read from the page${g.via ? ` (<code>${esc(g.via)}</code>)` : ''}: ${nf(g.tweens || 0, 0)} tweens, ${nf(g.timelines || 0, 0)} timelines and ${nf(g.scrollTriggers || 0, 0)} ScrollTriggers${g.truncated ? ', the list cut at the probe’s cap' : ''}. Of its ${nf(sm.entries || E.length, 0)} declared ${(sm.entries || E.length) === 1 ? 'value' : 'values'}, compared with what REVA measured: ${esc(bits.join(', ') || 'none compared')}.</p>

      ${disRows.length ? `<h4 class="gname">Declared values that disagree with the recording</h4><ul class="rl">${disRows.slice(0, 6).map(x => li(x.e, x.n)).join('')}</ul>` : ''}

/* what the fitter saw and left: no model, or past the channel limit, in plain words (below-noise channels are not motion and stay out) */

/* ---------- search: a small box that finds text on every page, for browsers whose find cannot open hidden pages ---------- */
const FIND = { index: null, hits: [], on: 0 };
const FINDSEL = 'h1,h2,h3,h4,p,li,td,th,summary,dt,dd,.wn,.wf,.lab,.big,.hx,.cname,.fv,.fl,.tag,.nm,.smp,.tm,.ln,.ls,pre,figcaption';

}
{
  const fb = $('#findbtn'), f = $('#find'), q = $('#findq'), ul = $('#findres');
  fb.addEventListener('click', findOpen);

addEventListener('keydown', e => {
