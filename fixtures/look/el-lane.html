<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>look fixture: pseudo-elements, late-built nodes, a runtime-replaced easing variable</title>
<!-- Own fixture for `reva look --el` (no site content). Known by construction:
  .u::after      hover: underline, CSS transition of transform scaleX(0) -> scaleX(1), 450 ms, cubic-bezier(0.19, 1, 0.22, 1).
  .dot::before   hover: CSS transition of opacity 0 -> 1, 300 ms, ease-in-out.
  .pulse::after  load: CSS animation `grow`, scaleX(0) -> scaleX(1), 800 ms, cubic-bezier(0.4, 0, 0.2, 1), fill both.
  #split .ch     six letters the page builds 1500 ms after load (setTimeout); each fades in with a Web Animation
                 (opacity 0 -> 1, 600 ms linear, delay 100 ms x index).
  #rows .row     five rows the page builds 2200 ms after load; their opacity follows the scroll (set from a scroll listener):
                 clamp((scrollY - 100) / 300, 0, 1).
  .flip::after   hover: transform transition scaleX(1) -> scaleX(0), 600 ms, cubic-bezier(0.3, 1.5, 0.7, 1.5): the easing overshoots
                 1, so the scale dips below 0 (a mirrored matrix, det < 0) for a few frames before it settles at 0.
-->
<style>
  html, body { margin: 0; }
  body { height: 3000px; font: 16px/1.4 system-ui, sans-serif; background: #fff; color: #111; }
  .u { position: absolute; left: 60px; top: 60px; display: inline-block; padding: 6px 0; }
  .u::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: #111; transform: scaleX(0); transform-origin: left; transition: transform 450ms cubic-bezier(0.19, 1, 0.22, 1); }
  .u:hover::after { transform: scaleX(1); }
  .dot { position: absolute; left: 260px; top: 60px; width: 40px; height: 40px; }
  .dot::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: #c33; opacity: 0; transition: opacity 300ms ease-in-out; }
  .dot:hover::before { opacity: 1; }
  .pulse { position: absolute; left: 360px; top: 60px; width: 120px; height: 24px; }
  .pulse::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #36c; transform-origin: left; animation: grow 800ms cubic-bezier(0.4, 0, 0.2, 1) both; }
  @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  #split { position: absolute; left: 60px; top: 160px; font-size: 40px; }
  #split .ch { display: inline-block; }
  .flip { position: absolute; left: 60px; top: 260px; width: 120px; height: 24px; }
  .flip::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: #a3a; transform: scaleX(1); transform-origin: left; transition: transform 600ms cubic-bezier(0.3, 1.5, 0.7, 1.5); }
  .flip:hover::after { transform: scaleX(0); }
  #rows { position: absolute; left: 60px; top: 500px; }
  #rows .row { width: 300px; height: 40px; margin-bottom: 12px; background: #693; opacity: 0; }
</style>
</head>
<body>
<a class="u" href="#">underline</a>
<div class="dot"></div>
<div class="pulse"></div>
<div id="split"></div>
<div class="flip"></div>
<div id="rows"></div>
<script>
  setTimeout(() => {
    const host = document.getElementById('split');
    [...'ABCDEF'].forEach((c, i) => {
      const s = document.createElement('span'); s.className = 'ch'; s.textContent = c; host.append(s);
      s.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 600, easing: 'linear', delay: 100 * i, fill: 'both' });
    });
  }, 1500);
  setTimeout(() => {
    const host = document.getElementById('rows');
    for (let i = 0; i < 5; i++) { const d = document.createElement('div'); d.className = 'row'; host.append(d); }
    apply();
  }, 2200);
  function apply() {
    const o = Math.min(1, Math.max(0, (scrollY - 100) / 300));
    for (const r of document.querySelectorAll('#rows .row')) r.style.opacity = String(o);
  }
  addEventListener('scroll', apply, { passive: true });
</script>
</body>
</html>
