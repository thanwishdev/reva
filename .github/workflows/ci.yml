name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check the browser pins
        run: npm run check:pins
      - name: Install the pinned headless browser
        run: node bin/reva.js doctor --install
      - name: Doctor
        run: node bin/reva.js doctor
      - name: Test
        run: npm test
      - name: Package contents
        run: npm pack --dry-run
